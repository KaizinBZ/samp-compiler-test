name: compilar-apk

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Link do projeto (.zip / .rar)'
        required: true
      password:
        description: 'Senha do arquivo (opcional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Extrair source
        env:
          URL: ${{ inputs.source_url }}
          PW: ${{ inputs.password }}
        run: |
          set -o pipefail
          mkdir -p /tmp/src && cd /tmp/src
          sudo apt-get -qq update >/dev/null 2>&1 || true
          sudo apt-get -qq install -y p7zip-full unrar-free >/dev/null 2>&1 || true

          echo "URL recebida: $URL"

          if echo "$URL" | grep -qi 'drive.google.com'; then
            pip install -q --no-input gdown
            gdown --fuzzy "$URL" -O source.bin || gdown "$URL" -O source.bin
          elif echo "$URL" | grep -qi 'mediafire.com'; then
            PAGE=$(curl -sL -A "Mozilla/5.0" "$URL")
            REAL=$(printf '%s' "$PAGE" | grep -oE 'https://download[0-9]*\.mediafire\.com/[^"]+' | head -1)
            if [ -z "$REAL" ]; then
              REAL=$(printf '%s' "$PAGE" | grep -oE 'href="[^"]*mediafire[^"]*"' | head -1 | sed 's/href="//;s/"$//')
            fi
            if [ -z "$REAL" ]; then echo "::error::MediaFire: não achei o link de download (arquivo removido ou link de pasta?)."; exit 1; fi
            echo "Download direto: $REAL"
            curl -L --retry 3 --max-time 900 -A "Mozilla/5.0" -o source.bin "$REAL"
          else
            curl -L --retry 3 --max-time 900 -o source.bin "$URL"
          fi

          echo "--- arquivo baixado ---"
          ls -lh source.bin
          file source.bin || true
          TAM=$(stat -c%s source.bin 2>/dev/null || echo 0)
          if [ "$TAM" -lt 200 ]; then echo "::error::Download muito pequeno (${TAM} bytes). Link inválido ou privado."; head -c 300 source.bin; exit 1; fi
          if head -c 400 source.bin | grep -qi '<html\|<!DOCTYPE'; then
            echo "::error::O link devolveu uma página HTML, não o arquivo. Use link direto de download."
            head -c 300 source.bin; exit 1
          fi

          echo "--- extraindo ---"
          EXTRAIU=0
          if 7z l source.bin >/dev/null 2>&1; then
            if [ -n "$PW" ]; then
              7z x -y -p"$PW" source.bin -o. >/dev/null 2>&1 && EXTRAIU=1 || EXTRAIU=0
            else
              7z x -y source.bin -o. >/dev/null 2>&1 && EXTRAIU=1 || EXTRAIU=0
            fi
            if [ "$EXTRAIU" = "0" ] && [ -n "$PW" ]; then
              7z x -y source.bin -o. >/dev/null 2>&1 && EXTRAIU=1
            fi
          elif tar -tf source.bin >/dev/null 2>&1; then
            tar -xf source.bin && EXTRAIU=1
          fi
          if [ "$EXTRAIU" = "0" ]; then
            echo "::error::Não consegui extrair. Formato não suportado ou senha incorreta."
            file source.bin; exit 1
          fi

          echo "--- conteudo extraido ---"
          find . -maxdepth 3 -not -path '*/\.git/*' | head -50
          if [ -z "$(find . -name build.gradle -o -name 'build.gradle.kts' -o -name settings.gradle | head -1)" ]; then
            echo "::error::Extraiu, mas não achei build.gradle/settings.gradle (isso não parece um projeto Android)."
            exit 1
          fi

      - name: Verificação
        id: proj
        run: |
          FILE=$(find /tmp/src -name "settings.gradle*" | head -1)
          [ -z "$FILE" ] && FILE=$(find /tmp/src -name "build.gradle*" | head -1)
          if [ -z "$FILE" ]; then echo "::error::build.gradle não encontrado."; exit 1; fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "Projeto: $DIR"
          ls -la "$DIR" | head -20
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: APK debug
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then ./gradlew assembleDebug --no-daemon --stacktrace; else gradle assembleDebug --no-daemon --stacktrace; fi

      - name: Entregar APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: ${{ steps.proj.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Gerar link de download (3 dias)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find ${{ steps.proj.outputs.dir }} -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::APK não encontrado para publicar"; exit 1; fi
          TAG="apk-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$APK#app-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "APK debug $TAG" \
            --notes "Gerado pelo bot Bravuz Network. Link expira em 3 dias." || exit 1
          echo "Link publicado: $TAG"
